server:
  port: 8082

spring:
  application:
    name: ms-rutaexpress-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/70d90397-3549-4694-8a16-70f45020c6fa/v2.0
          # audiences: se valida en API Gateway (JWT Authorizer).
          # El BFF solo valida firma, issuer y expiración.

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never