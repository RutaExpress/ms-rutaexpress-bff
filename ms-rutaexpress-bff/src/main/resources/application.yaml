server:
  port: 8082

spring:
  application:
    name: ms-rutaexpress-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/70d90397-3549-4694-8a16-70f45020c6fa/v2.0
          audiences: 5421b650-58dc-4ae6-863e-a34f55e0177a

# CORS configurable por variable de entorno.
# En local usa http://localhost:4200 por defecto.
# En EC2 se sobreescribe con APP_CORS_ALLOWED_ORIGINS=http://<EIP>,https://ec36sjsopk...
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator: expone /actuator/health (auto-generado, sin controller)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never